name: 🛠️ CI · Maintenance

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run.
        required: true
        default: true
        type: boolean

permissions: {}

jobs:
  maven_wrapper:
    permissions:
      actions: write
      contents: write
      pull-requests: write
    uses: YunaBraska/YunaBraska/.github/workflows/wc_java_update_maven_wrapper.yml@036626606065b3b64488ef0611d63713abdcf70c
    with:
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}

  upstream:
    permissions:
      actions: write
      contents: write
      packages: read
      pull-requests: write
    uses: YunaBraska/YunaBraska/.github/workflows/wc_java_update_upstream.yml@036626606065b3b64488ef0611d63713abdcf70c
    with:
      upstream_repository: nats-io/nats-server
      upstream_property: nats-server.version
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
