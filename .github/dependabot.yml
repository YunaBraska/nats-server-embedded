version: 2
updates:
  - package-ecosystem: maven
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      maven-all:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      actions-all:
        patterns:
          - '*'
